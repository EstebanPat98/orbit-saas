<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Orbit: analítica simple y potente para equipos modernos.">
  <title>Orbit | Analítica para equipos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
  try {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const useDark = saved ? saved === 'dark' : prefersDark;
    document.documentElement.classList.toggle('dark', useDark);
  } catch (e) {}
</script>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased">
<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

    <a href="#" class="text-xl font-extrabold tracking-tight">
      Orbit<span class="text-brand-500">.</span>
    </a>

    <nav class="hidden items-center gap-8 text-sm font-medium text-slate-600 dark:text-slate-400 md:flex">
      <a href="#caracteristicas" class="transition hover:text-slate-900 dark:hover:text-white">Características</a>
      <a href="#precios" class="transition hover:text-slate-900 dark:hover:text-white">Precios</a>
      <a href="#faq" class="transition hover:text-slate-900 dark:hover:text-white">FAQ</a>
    </nav>

    <div class="flex items-center gap-3">
      <button id="theme-toggle" aria-label="Cambiar tema"
        class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800">
        <!-- Sol: visible solo en modo oscuro -->
        <svg class="hidden h-5 w-5 dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/>
          <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <!-- Luna: visible solo en modo claro -->
        <svg class="h-5 w-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>

      <a href="#precios" class="hidden rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-500 sm:block">
        Empezar gratis
      </a>
    </div>

  </div>
</header>

  <main class="min-h-screen flex flex-col items-center justify-center gap-6 px-6 text-center">
    <h1 class="text-4xl font-extrabold md:text-6xl">
      Hola, <span class="text-brand-500">Orbit</span>
    </h1>
    <p class="max-w-md text-slate-600 dark:text-slate-400">
      Si ves esto con estilo, Tailwind está funcionando.
    </p>
    <a href="#" class="rounded-xl bg-brand-600 px-6 py-3 font-semibold text-white transition hover:bg-brand-500 hover:-translate-y-0.5">
      Empezar gratis
    </a>
  </main>
  
  <script src="js/main.js"></script>
</body>
</html>
